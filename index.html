    <!-- Consent Mode v2 defaults: deny analytics/ad storage until the cookie banner
         (public/cookie-consent.js) records a choice, then restore any saved choice.
         This must run before GTM loads so GA4/Ads tags inside the container see it. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500,
      });
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('rios_consent_v1') || 'null');
          if (saved && typeof saved === 'object') {
            gtag('consent', 'update', {
              analytics_storage: saved.analytics ? 'granted' : 'denied',
              ad_storage: saved.marketing ? 'granted' : 'denied',
              ad_user_data: saved.marketing ? 'granted' : 'denied',
              ad_personalization: saved.marketing ? 'granted' : 'denied',
            });
          }
        } catch (e) { /* We treat unreadable storage as "no decision yet". */ }
      })();
    </script>
